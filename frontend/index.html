<html lang="en-NZ">

<body>
<header class="bar">

  <span id="savestat" class="savestat" role="status" aria-live="polite"></span>

  <button data-act="import">Open record</button>
  <button data-act="print">Print record</button>

</header>
<div class="wrap">
  <nav class="side" id="side" aria-label="Stages"></nav>
  <main id="main"></main>

<input type="file" id="att" multiple hidden>
<dialog id="critdlg"><div class="dlghead"><h3 id="dlgtitle"></h3><button class="btn ghost" data-act="closecrits">Close</button></div><div id="critbody"></div></dialog>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/content.js"></script>
